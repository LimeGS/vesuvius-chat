services:
  rag:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    environment:
      RAG_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  refresh:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    environment:
      RAG_DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
