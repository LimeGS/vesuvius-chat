name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Publication safety
        run: node scripts/check-publication.mjs
      - name: Locked dependencies
        run: npm run install:ci
      - name: Python test dependencies
        run: python -m pip install numpy==2.2.6 mcp==1.30.0 requests==2.32.5
      - name: Application tests and coverage
        run: npm run test:coverage -- --maxWorkers=1
      - name: Python backend tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Offline native security integration
        run: npm run test:security
      - name: Dependency audit
        run: npm audit --json > audit.json
      - name: Verify badge evidence and strict coverage floor
        run: node scripts/update-badges.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            coverage/coverage-summary.json
            audit.json
          retention-days: 7
